services:
  # Backend FastAPI Service
  - type: web
    name: pitchplay-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false # Set to MongoDB Atlas connection string
      - key: DB_NAME
        value: pitchplay
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_MOBILE
        value: "9602341799"
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ADMIN_UPI_ID
        value: "9602341799@upi"
      - key: CORS_ORIGINS
        value: "*"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Frontend Static Site Service
  - type: web
    name: pitchplay-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: pitchplay-backend
          property: host
